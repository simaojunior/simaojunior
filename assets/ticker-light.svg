<svg xmlns="http://www.w3.org/2000/svg" width="880" height="52" viewBox="0 0 880 52" role="img" aria-label="Mission board: status shipping day to day; training Elixir OTP supervision trees; site running on Phoenix and Fly.io; rewatching Shippuden arc 14; open to interesting missions">
  <defs>
    <clipPath id="tickerClip"><rect x="116" y="1" width="763" height="50" rx="5"/></clipPath>
    <linearGradient id="fadeL" x1="0" x2="1">
      <stop offset="0" stop-color="#f9f5d7" stop-opacity="1"/>
      <stop offset="1" stop-color="#f9f5d7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#f9f5d7" stop-opacity="0"/>
      <stop offset="1" stop-color="#f9f5d7" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="51" rx="6" fill="#f9f5d7" stroke="#d8d2b0" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="116" height="51" rx="6" fill="#f0ebce"/>
  <rect x="110" y="0.5" width="6" height="51" fill="#f0ebce"/>
  <line x1="116" y1="0.5" x2="116" y2="51.5" stroke="#d8d2b0" stroke-width="1"/>
  <text x="58" y="30" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#b64f33" letter-spacing="1.4" text-anchor="middle">MISSION</text>
  <text x="58" y="42" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#b64f33" letter-spacing="1.4" text-anchor="middle">BOARD</text>
  <circle cx="58" cy="14" r="3" fill="#98531e">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <g clip-path="url(#tickerClip)">
    <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-1474 0" dur="38.8s" repeatCount="indefinite"/>
      <text x="130" y="31" xml:space="preserve"><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> status: shipping day to day  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> training: Elixir, OTP supervision trees  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> site running on Phoenix + Fly.io  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> rewatching Shippuden, arc 14  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> open to interesting missions  &#183;  </tspan></text>
      <text x="1604" y="31" xml:space="preserve"><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> status: shipping day to day  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> training: Elixir, OTP supervision trees  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> site running on Phoenix + Fly.io  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> rewatching Shippuden, arc 14  &#183;  </tspan><tspan fill="#98531e">&#10022;</tspan><tspan fill="#52544c"> open to interesting missions  &#183;  </tspan></text>
    </g>
  </g>

  <rect x="116" y="1" width="40" height="50" fill="url(#fadeL)"/>
  <rect x="839" y="1" width="40" height="50" fill="url(#fadeR)"/>
</svg>
